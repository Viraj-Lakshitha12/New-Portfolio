<div
  style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; padding: 50px 16px; margin: 0;">

  <div
    style="max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">

    <!-- Top accent bar -->
    <div style="height: 6px; background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);"></div>

    <!-- Header -->
    <div style="padding: 40px 36px 28px; text-align: center;">
      <div
        style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 18px; margin-bottom: 20px; box-shadow: 0 12px 24px -6px rgba(99, 102, 241, 0.5);">
        <span style="font-size: 26px; color: white; line-height: 1;">✦</span>
      </div>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -0.7px;">New Connection
      </h1>
      <p style="margin: 8px 0 0; font-size: 15px; color: #64748b; font-weight: 500;">
        Someone just reached out from your portfolio
      </p>
    </div>

    <!-- Content -->
    <div style="padding: 0 36px 40px;">

      <!-- Sender Info -->
      <div
        style="background: #f8fafc; border-radius: 16px; padding: 24px 26px; margin-bottom: 28px; border: 1px solid #e2e8f0;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding-bottom: 18px; border-bottom: 1px solid #e2e8f0;">
              <p
                style="margin: 0 0 4px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px;">
                Name</p>
              <p style="margin: 0; font-size: 19px; font-weight: 700; color: #0f172a;">{{from_name}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 18px;">
              <p
                style="margin: 0 0 4px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px;">
                Email</p>
              <a href="mailto:{{from_email}}"
                style="font-size: 16px; font-weight: 600; color: #6366f1; text-decoration: none;">{{from_email}}</a>
            </td>
          </tr>
        </table>
      </div>

      <!-- Message -->
      <div style="margin-bottom: 36px;">
        <p
          style="margin: 0 0 12px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.2px;">
          Message</p>
        <div
          style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; position: relative;">
          <div
            style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, #6366f1, #a855f7); border-radius: 14px 0 0 14px;">
          </div>
          <p
            style="margin: 0; font-size: 16px; line-height: 1.7; color: #334155; white-space: pre-wrap; padding-left: 8px;">
            {{message}}</p>
        </div>
      </div>

      <!-- CTA -->
      <div style="text-align: center;">
        <a href="mailto:{{from_email}}?subject=Re:%20Portfolio%20Inquiry"
          style="display: inline-block; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; padding: 16px 40px; border-radius: 14px; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.45); letter-spacing: 0.2px;">
          Reply to {{from_name}} →
        </a>
      </div>

    </div>

    <!-- Footer -->
    <div style="background: #f8fafc; padding: 20px 36px; text-align: center; border-top: 1px solid #e2e8f0;">
      <p style="margin: 0; font-size: 13px; color: #94a3b8;">
        Sent securely via <a href="https://new-portfolio-pi-gules.vercel.app/"
          style="color: #6366f1; text-decoration: none; font-weight: 600;">your website</a>
      </p>
    </div>

  </div>
</div>
