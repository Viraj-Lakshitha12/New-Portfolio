<div
  style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; padding: 40px 15px; margin: 0; color: #1f2937;">

  <!-- Main Card -->
  <div
    style="max-width: 580px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); overflow: hidden;">

    <!-- Center Aligned Header -->
    <div
      style="background-color: #ffffff; padding: 35px 35px 20px; border-bottom: 1px solid #f3f4f6; text-align: center;">
      <div
        style="display: inline-block; background-color: #eef2ff; color: #4338ca; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; padding: 6px 14px; border-radius: 20px; margin-bottom: 16px;">
        ✦ New Portfolio Inquiry
      </div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #111827; letter-spacing: -0.5px;">Message Received
      </h1>
      <p style="margin: 8px 0 0; font-size: 14px; color: #6b7280;">
        Sent securely via <a href="https://new-portfolio-pi-gules.vercel.app/" target="_blank"
          style="color: #4f46e5; text-decoration: none; font-weight: 600;">your website</a>
      </p>
    </div>

    <!-- Content Body -->
    <div style="padding: 35px;">

      <!-- Sender Info Grid -->
      <div
        style="background-color: #fafafa; border: 1px solid #f4f4f5; border-radius: 10px; padding: 20px; margin-bottom: 30px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="border: none;">
          <tr>
            <td style="padding-bottom: 14px; border-bottom: 1px solid #e5e7eb;">
              <p
                style="margin: 0 0 4px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.8px;">
                Sender Name</p>
              <p style="margin: 0; font-size: 16px; font-weight: 600; color: #111827;">{{from_name}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 14px;">
              <p
                style="margin: 0 0 4px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.8px;">
                Email Address</p>
              <a href="mailto:{{from_email}}"
                style="margin: 0; font-size: 15px; font-weight: 500; color: #2563eb; text-decoration: none;">{{from_email}}</a>
            </td>
          </tr>
        </table>
      </div>

      <!-- Message Area -->
      <div style="margin-bottom: 35px;">
        <p
          style="margin: 0 0 10px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.8px;">
          Message Content</p>
        <div
          style="background-color: #ffffff; border: 1px solid #e5e7eb; border-left: 4px solid #4338ca; border-radius: 8px; padding: 20px;">
          <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #374151; white-space: pre-wrap;">{{message}}
          </p>
        </div>
      </div>

      <!-- Action Button -->
      <div style="text-align: center;">
        <a href="mailto:{{from_email}}?subject=Re: Portfolio Inquiry"
          style="display: inline-block; background-color: #111827; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; padding: 15px 35px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); letter-spacing: 0.5px;">
          Reply to {{from_name}} &rarr;
        </a>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div style="max-width: 580px; margin: 0 auto; text-align: center; padding-top: 24px;">
    <p style="margin: 0; font-size: 12px; color: #9ca3af;">
      Automated email from <a href="https://new-portfolio-pi-gules.vercel.app/" target="_blank"
        style="color: #9ca3af; text-decoration: underline;">new-portfolio-pi-gules.vercel.app</a>
    </p>
  </div>

</div>
