<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viraj Lakshitha Adhikari | Full Stack Engineer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a12;
      --bg-card: rgba(15, 15, 25, 0.6);
      --accent: #00f5ff;
      --accent-secondary: #ff00ff;
      --accent-tertiary: #00ff88;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b5;
      --border: rgba(255, 255, 255, 0.06);
      --glow: rgba(0, 245, 255, 0.5);
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fc;
      --bg-card: rgba(255, 255, 255, 0.8);
      --accent: #0066ff;
      --accent-secondary: #6633ff;
      --accent-tertiary: #00cc88;
      --text-primary: #0a0a1a;
      --text-secondary: #5a5a7a;
      --border: rgba(0, 0, 0, 0.06);
      --glow: rgba(0, 102, 255, 0.3);
    }

    [data-theme="colorful-2026"] {
      --bg-primary: #0a0015;
      --bg-secondary: #150028;
      --bg-card: rgba(20, 20, 40, 0.6);
      --accent: #ff6b6b;
      --accent-secondary: #4ecdc4;
      --accent-tertiary: #ffd166;
      --text-primary: #ffffff;
      --text-secondary: #b8b8d1;
      --border: rgba(255, 107, 107, 0.1);
      --glow: rgba(255, 107, 107, 0.4);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle at 20% 20%, rgba(0, 245, 255, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.08) 0%, transparent 50%), radial-gradient(circle at 40% 80%, rgba(0, 255, 136, 0.06) 0%, transparent 50%);
      animation: meshMove 25s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes meshMove {

      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }

      33% {
        transform: translate(30px, -50px) rotate(120deg);
      }

      66% {
        transform: translate(-20px, 20px) rotate(240deg);
      }
    }

    #root {
      position: relative;
      z-index: 1;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      line-height: 1.2;
    }

    .modern-navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 1100px;
      z-index: 1000;
      padding: 14px 28px;
      background: rgba(10, 10, 18, 0.4);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 100px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modern-navbar.scrolled {
      top: 10px;
      padding: 12px 24px;
      background: rgba(10, 10, 18, 0.7);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
      position: relative;
      font-family: "Space Grotesk", sans-serif;
    }

    .nav-logo::after {
      content: "2026";
      position: absolute;
      top: -10px;
      right: -38px;
      font-size: 0.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-tertiary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      opacity: 0.9;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      list-style: none;
      align-items: center;
    }

    .nav-link {
      padding: 8px 18px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .nav-link::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 50px;
      z-index: -1;
    }

    .nav-link:hover::before {
      opacity: 0.12;
    }

    .nav-link:hover {
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .nav-link.active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .theme-toggle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.05) rotate(10deg);
      border-color: var(--accent);
    }

    .theme-icon {
      font-size: 1.15rem;
      transition: transform 0.3s ease;
    }

    section {
      padding: 100px 24px;
      max-width: 1320px;
      margin: 0 auto;
      position: relative;
    }

    section:first-of-type {
      padding-top: 140px;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 50%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    .modern-card {
      background: var(--bg-card);
      backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .modern-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 0;
    }

    .modern-card:hover::before {
      opacity: 0.04;
    }

    .modern-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 60px var(--glow);
    }

    .btn-primary {
      padding: 15px 32px;
      font-size: 0.98rem;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #fff;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px var(--glow);
      font-family: "Inter", sans-serif;
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-primary:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--glow);
    }

    .btn-primary span {
      position: relative;
      z-index: 1;
    }

    .btn-secondary {
      padding: 15px 32px;
      font-size: 0.98rem;
      font-weight: 600;
      border: 1.5px solid var(--accent);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    .btn-secondary::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .btn-secondary span {
      position: relative;
      z-index: 1;
    }

    .btn-secondary:hover::before {
      width: 100%;
    }

    .btn-secondary:hover {
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--glow);
      color: #fff;
    }

    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .tech-badge:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 48px;
      border: 2px solid var(--accent);
      border-radius: 25px;
      display: flex;
      justify-content: center;
      padding-top: 8px;
      opacity: 0.5;
      animation: fadeInOut 3s infinite;
    }

    .scroll-indicator::before {
      content: "";
      width: 4px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
      animation: scrollDown 2s infinite;
    }

    @keyframes scrollDown {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(20px);
        opacity: 0;
      }
    }

    @keyframes fadeInOut {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.7;
      }
    }

    .map-container {
      width: 100%;
      height: 450px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* CONTACT FORM */
    .contact-form-container {
      max-width: 700px;
      margin: 0 auto 70px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: "Inter", sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .form-textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #fff;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px var(--glow);
      font-family: "Inter", sans-serif;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .submit-btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--glow);
    }

    .submit-btn span {
      position: relative;
      z-index: 1;
    }

    /* MODERN FOOTER */
    .modern-footer {
      padding: 60px 24px 40px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      position: relative;
    }

    .modern-footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .footer-content {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 40px;
      margin-bottom: 40px;
    }

    .footer-section h3 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-link:hover {
      color: var(--accent);
      transform: translateX(5px);
    }

    .footer-social {
      display: flex;
      gap: 14px;
      margin-top: 10px;
    }

    .footer-social-link {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--accent);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .footer-social-link:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--glow);
    }

    .footer-bottom {
      text-align: center;
      padding-top: 30px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .footer-bottom p {
      margin-bottom: 8px;
    }

    .mode-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-card);
      backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      z-index: 2000;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
    }

    .mode-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1999;
    }

    .mode-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 24px 0;
    }

    .mode-option {
      padding: 22px;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.02);
    }

    .mode-option:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .mode-option.active {
      border-color: var(--accent);
      background: rgba(0, 245, 255, 0.08);
      box-shadow: 0 0 30px var(--glow);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeInUp 0.7s ease-out forwards;
    }

    .social-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .social-icon::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .social-icon:hover::before {
      opacity: 0.15;
    }

    .social-icon:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--glow);
    }

    .social-icon i {
      color: var(--accent);
      font-size: 1.15rem;
      position: relative;
      z-index: 1;
    }

    /* ULTRA-MODERN TECH STACK VISUALIZATION */
    .tech-showcase-container {
      position: relative;
      width: 100%;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tech-orbit-system {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .tech-center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      box-shadow: 0 0 60px var(--glow), inset 0 0 20px rgba(255, 255, 255, 0.2);
      animation: pulse 3s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 60px var(--glow);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 80px var(--glow);
      }
    }

    .tech-orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px solid var(--border);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    .tech-orbit-1 {
      width: 250px;
      height: 250px;
      margin: -125px 0 0 -125px;
    }

    .tech-orbit-2 {
      width: 350px;
      height: 350px;
      margin: -175px 0 0 -175px;
      animation-duration: 30s;
      animation-direction: reverse;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .tech-icon-orbit {
      position: absolute;
      width: 80px;
      height: 80px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      animation: counterRotate 20s linear infinite;
    }

    .tech-orbit-2 .tech-icon-orbit {
      animation-duration: 30s;
      animation-direction: reverse;
    }

    @keyframes counterRotate {
      from {
        transform: rotate(360deg);
      }

      to {

        fetch(formEndpoint, {

              setFormData({ name: '', email: '', subject: '', message: '' });

              setFormStatus('error');

              </div>
              <div className="form-group">
                <label className="form-label">Subject</label>
                <input type="text" name="subject" className="form-input" placeholder="Enter your subject here (e.g. Just saying Hi!)" value={formData.subject} onChange={handleChange} required />
              </div>
              <div className="form-group">
                <label className="form-label">Message</label>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '22px', marginBottom: '70px' }}>

              <div key={i} className="modern-card" style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '3.2rem', marginBottom: '14px' }}>{item.icon}</div>

              </div>

          </div>

          <div style={{ marginBottom: '70px' }}>

            <div className="footer-social">

            </div>

            <h3>Technologies</h3>

              <span className="footer-link"><i className="fab fa-react" style={{ width: '16px' }}></i> React & Node.js</span>
              <span className="footer-link"><i className="fab fa-docker" style={{ width: '16px' }}></i> Docker & Kubernetes</span>
              <span className="footer-link"><i className="fab fa-aws" style={{ width: '16px' }}></i> AWS Cloud</span>
            </div>
