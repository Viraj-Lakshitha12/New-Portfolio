<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viraj Lakshitha Adhikari | Full Stack Engineer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    :root {
      /* Dark Mode (Default) - Enhanced 2026 Style */
      --bg-primary: #0a0a0f;
      --bg-secondary: #13131a;
      --bg-card: rgba(20, 20, 30, 0.9);
      --accent: #00f5ff;
      --accent-secondary: #ff00ff;
      --accent-tertiary: #00ff88;
      --accent-vibrant: #ff6b6b;
      --text-primary: #ffffff;
      --text-secondary: #b0b0c0;
      --border: rgba(0, 245, 255, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.4);
      --gradient-1: radial-gradient(circle at 20% 30%, rgba(0, 245, 255, 0.2) 0%, transparent 50%);
      --gradient-2: radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.2) 0%, transparent 50%);
      --gradient-3: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.15) 0%, transparent 60%);
    }

    [data-theme="light"] {
      /* Light Mode - Modern 2026 Tech Stack */
      --bg-primary: #f5f7ff;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --accent: #0066ff;
      --accent-secondary: #6633ff;
      --accent-tertiary: #00cc88;
      --accent-vibrant: #ff3366;
      --text-primary: #1a1a2e;
      --text-secondary: #5a5a7a;
      --border: rgba(0, 102, 255, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.08);
      --gradient-1: radial-gradient(circle at 20% 30%, rgba(0, 102, 255, 0.1) 0%, transparent 50%);
      --gradient-2: radial-gradient(circle at 80% 70%, rgba(102, 51, 255, 0.1) 0%, transparent 50%);
      --gradient-3: radial-gradient(circle at 50% 50%, rgba(0, 204, 136, 0.08) 0%, transparent 60%);
    }

    [data-theme="colorful-2026"] {
      /* Colorful 2026 Mode - Vibrant & Modern */
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(26, 26, 46, 0.9);
      --accent: #ff6b6b;
      --accent-secondary: #4ecdc4;
      --accent-tertiary: #ffd166;
      --accent-vibrant: #ff9a76;
      --text-primary: #ffffff;
      --text-secondary: #b8b8d1;
      --border: rgba(255, 107, 107, 0.3);
      --shadow-color: rgba(0, 0, 0, 0.5);
      --gradient-1: radial-gradient(circle at 20% 30%, rgba(255, 107, 107, 0.2) 0%, transparent 50%);
      --gradient-2: radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.2) 0%, transparent 50%);
      --gradient-3: radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.2) 0%, transparent 60%);
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      transition: background-color 0.5s ease;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: var(--gradient-1), var(--gradient-2), var(--gradient-3);
      pointer-events: none;
      z-index: 0;
      transition: background 0.5s ease;
    }

    #root {
      position: relative;
      z-index: 1;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: "Space Grotesk", sans-serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    /* Theme Toggle Button - Only One Icon */
    .theme-toggle {
      position: fixed;
      top: 100px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border);
      backdrop-filter: blur(20px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent);
    }

    .theme-icon {
      font-size: 1.5rem;
      transition: transform 0.3s ease;
    }

    /* Mode Selection Modal */
    .mode-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      z-index: 2000;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px var(--shadow-color);
      max-width: 500px;
      width: 90%;
    }

    .mode-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      z-index: 1999;
    }

    .mode-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 2rem 0;
    }

    .mode-option {
      padding: 1.5rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }

    .mode-option:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
    }

    .mode-option.active {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb, 0, 245, 255), 0.1);
    }

    /* 2026 Style Elements */
    .year-2026 {
      position: relative;
    }

    .year-2026::after {
      content: "2026";
      position: absolute;
      top: -10px;
      right: -40px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      opacity: 0.7;
      animation: pulse 2s infinite;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.7;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    .fade-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .github-link:hover {
      background: var(--accent);
      color: var(--bg-primary);
      transform: translateY(-2px);
    }

    .tech-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      background: rgba(var(--accent-rgb, 0, 245, 255), 0.1);
      border: 1px solid rgba(var(--accent-rgb, 0, 245, 255), 0.3);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--accent);
      margin: 0.25rem;
      transition: all 0.3s ease;
    }

    .tech-badge:hover {
      transform: translateY(-2px);
      background: rgba(var(--accent-rgb, 0, 245, 255), 0.2);
    }

    .map-container {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Mobile Menu Toggle */
    .mobile-menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1002;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 1024px) {
      .mobile-menu-toggle {
        display: block;
      }

      .map-container {
        height: 300px;
      }

      .theme-toggle {
        top: 80px;
        right: 10px;
        width: 45px;
        height: 45px;
      }

      .mode-options {
        grid-template-columns: 1fr;
      }
    }

    /* Tech Stack Floating Cards */
    .tech-card {
      position: absolute;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      animation: float 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }

    .tech-card:hover {
      transform: scale(1.1) !important;
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(var(--accent-rgb, 0, 245, 255), 0.4);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .desktop-menu {
        display: none;
      }

      .mobile-menu {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Theme Context
    const ThemeContext = React.createContext();

    // Theme Provider Component
    const ThemeProvider = ({ children }) => {
      const [theme, setTheme] = useState('dark');
      const [showModeModal, setShowModeModal] = useState(false);

      useEffect(() => {
        const savedTheme = localStorage.getItem('portfolio-theme') || 'dark';
        setTheme(savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);
      }, []);

      const toggleTheme = (newTheme) => {
        setTheme(newTheme);
        localStorage.setItem('portfolio-theme', newTheme);
        document.documentElement.setAttribute('data-theme', newTheme);
      };

      const openModeModal = () => {
        setShowModeModal(true);
      };

      const closeModeModal = () => {
        setShowModeModal(false);
      };

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme, openModeModal, closeModeModal }}>
          {children}
          {showModeModal && <ModeSelectionModal />}
        </ThemeContext.Provider>
      );
    };

    // Mode Selection Modal Component
    const ModeSelectionModal = () => {
      const { theme, toggleTheme, closeModeModal } = React.useContext(ThemeContext);

      const modeOptions = [
        {
          id: 'dark',
          name: 'Dark Mode',
          icon: '🌙',
          description: 'Neon tech vibe with cyberpunk accents'
        },
        {
          id: 'light',
          name: 'Light Mode',
          icon: '☀️',
          description: 'Clean modern interface for productivity'
        },
        {
          id: 'auto',
          name: 'Auto Detect',
          icon: '⚙️',
          description: 'Sync with system preferences'
        },
        {
          id: 'colorful-2026',
          name: '2026 Colorful',
          icon: '🌈',
          description: 'Vibrant 2026 tech stack palette'
        }
      ];

      const handleModeSelect = (modeId) => {
        if (modeId === 'auto') {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          toggleTheme(prefersDark ? 'dark' : 'light');
        } else {
          toggleTheme(modeId);
        }
        setTimeout(closeModeModal, 300);
      };

      return (
        <>
          <div className="mode-modal-overlay" onClick={closeModeModal}></div>
          <div className="mode-modal">
            <h2 style={{ marginBottom: '1rem', color: 'var(--text-primary)' }}>Choose Theme Style</h2>
            <p style={{ color: 'var(--text-secondary)', marginBottom: '2rem' }}>
              Select your preferred viewing mode. Changes apply instantly.
            </p>

            <div className="mode-options">
              {modeOptions.map((option) => (
                <div
                  key={option.id}
                  className={`mode-option ${theme === option.id ? 'active' : ''}`}
                  onClick={() => handleModeSelect(option.id)}
                  style={{ background: 'var(--bg-card)' }}
                >
                  <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>{option.icon}</div>
                  <h4 style={{ marginBottom: '0.5rem', color: 'var(--text-primary)' }}>{option.name}</h4>
                  <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>{option.description}</p>
                </div>
              ))}
            </div>

            <button
              onClick={closeModeModal}
              style={{
                padding: '0.8rem 2rem',
                background: 'linear-gradient(135deg, var(--accent), var(--accent-secondary))',
                color: '#fff',
                border: 'none',
                borderRadius: '8px',
                cursor: 'pointer',
                fontWeight: '600',
                width: '100%',
                marginTop: '1rem'
              }}
            >
              Apply & Close
            </button>
          </div>
        </>
      );
    };

    // Theme Toggle Button Component - Only One Icon
    const ThemeToggleButton = () => {
      const { theme, openModeModal } = React.useContext(ThemeContext);

      return (
        <div className="theme-toggle" onClick={openModeModal}>
          <span className="theme-icon">
            {theme === 'dark' ? '🌙' : theme === 'light' ? '☀️' : '🌈'}
          </span>
        </div>
      );
    };

    // Navigation Component
    const Navigation = () => {
      const [scrolled, setScrolled] = useState(false);
      const { theme } = React.useContext(ThemeContext);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      const navStyle = {
        position: "fixed",
        top: 0,
        left: 0,
        right: 0,
        zIndex: 1000,
        background: scrolled
          ? "rgba(10, 10, 15, 0.95)"
          : "rgba(10, 10, 15, 0.5)",
        backdropFilter: "blur(20px)",
        borderBottom: scrolled
          ? "1px solid var(--border)"
          : "1px solid rgba(0, 245, 255, 0.1)",
        transition: "all 0.3s ease",
        padding: "1rem 0",
      };
      if (theme === 'light') {
        navStyle.background = scrolled ? 'rgba(245, 247, 255, 0.95)' : 'rgba(245, 247, 255, 0.5)';
      } else if (theme === 'colorful-2026') {
        navStyle.background = scrolled ? 'rgba(15, 15, 26, 0.95)' : 'rgba(15, 15, 26, 0.5)';
      }

      return (
        <nav style={navStyle}>
          <div style={{
            maxWidth: "1400px",
            margin: "0 auto",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
          }}>
            <div style={{
              fontSize: "1.3rem",
              fontWeight: "800",
              background: "linear-gradient(135deg, var(--accent), var(--accent-secondary))",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              fontFamily: "Space Grotesk",
              letterSpacing: "1px",
            }} className="year-2026">
              VIRAJ LAKSHITHA
            </div>

            {/* Desktop Menu */}
            <ul className="desktop-menu" style={{
              display: "flex",
              gap: "2.5rem",
              listStyle: "none",
              alignItems: "center",
            }}>
              {["Home", "About", "Experience", "Projects", "Skills", "Contact"].map((item) => (
                <li
                  key={item}
                  style={{
                    color: "var(--text-secondary)",
                    cursor: "pointer",
                    fontSize: "0.9rem",
                    fontWeight: "600",
                    transition: "all 0.3s ease",
                    padding: "0.5rem 0",
                  }}
                  onClick={() => document.getElementById(item.toLowerCase())?.scrollIntoView({ behavior: "smooth" })}
                  onMouseEnter={(e) => e.target.style.color = "var(--accent)"}
                  onMouseLeave={(e) => e.target.style.color = "var(--text-secondary)"}
                >
                  {item}
                </li>
              ))}
            </ul>
          </div>
        </nav>
      );
    };

    // Hero Section
    const Hero = () => {
      const techStack = [
        { name: "Java", icon: "☕", color: "#b07219", top: "10%", left: "10%" },
        { name: "Spring Boot", icon: "🍃", color: "#6db33f", top: "60%", left: "5%" },
        { name: "React", icon: "⚛️", color: "#61dafb", top: "15%", right: "15%" },
        { name: "Node.js", icon: "🟢", color: "#339933", top: "50%", right: "10%" },
        { name: "Docker", icon: "🐳", color: "#2496ed", top: "75%", right: "20%" },
        { name: "AWS", icon: "☁️", color: "#ff9900", top: "35%", left: "15%" },
      ];

      return (
        <section id="home" style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          position: "relative",
          padding: "8rem 2rem 4rem",
        }}>
          <div style={{
            maxWidth: "1400px",
            margin: "0 auto",
            width: "100%",
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit, minmax(400px, 1fr))",
            gap: "4rem",
            alignItems: "center",
          }}>
            {/* Left Content */}
            <div style={{ zIndex: 10 }} className="fade-in">
              <div style={{
                marginBottom: "1rem",
                color: "var(--text-secondary)",
                fontSize: "1.1rem",
              }}>
                👋 Hi, I'm
              </div>
              <h1 style={{
                fontSize: "clamp(2rem, 6vw, 4rem)",
                fontWeight: "800",
                lineHeight: "1.1",
                marginBottom: "1rem",
                background: "linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 50%, var(--accent-secondary) 100%)",
                WebkitBackgroundClip: "text",
                WebkitTextFillColor: "transparent",
                fontFamily: "Space Grotesk",
              }}>
                Viraj Lakshitha
                <br />
                Adhikari
              </h1>
              <div style={{
                fontSize: "clamp(1.3rem, 3vw, 2rem)",
                color: "var(--accent-tertiary)",
                marginBottom: "1.5rem",
                fontWeight: "700",
              }}>
                Full Stack Software Engineer
              </div>
              <p style={{
                fontSize: "1.1rem",
                color: "var(--text-secondary)",
                lineHeight: "1.8",
                marginBottom: "2.5rem",
              }}>
                Building scalable web applications with 3+ years of expertise
                in Java, Spring Boot, React, Node.js, and cloud technologies.
                Passionate about crafting innovative solutions that drive
                business value.
              </p>
              <div style={{
                display: "flex",
                gap: "1rem",
                flexWrap: "wrap",
                marginBottom: "2rem",
              }}>
                <button
                  style={{
                    padding: "1rem 2rem",
                    fontSize: "1rem",
                    fontWeight: "600",
                    border: "none",
                    background: "linear-gradient(135deg, var(--accent), var(--accent-secondary))",
                    color: "#fff",
                    cursor: "pointer",
                    borderRadius: "8px",
                    transition: "all 0.3s ease",
                    fontFamily: "Inter",
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.transform = "translateY(-2px)";
                    e.target.style.boxShadow = "0 10px 30px rgba(var(--accent-rgb, 0, 245, 255), 0.3)";
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.transform = "translateY(0)";
                    e.target.style.boxShadow = "none";
                  }}
                  onClick={() => document.getElementById("projects").scrollIntoView({ behavior: "smooth" })}
                >
                  View My Work
                </button>
                <button
                  style={{
                    padding: "1rem 2rem",
                    fontSize: "1rem",
                    fontWeight: "600",
                    border: "2px solid var(--accent)",
                    background: "transparent",
                    color: "var(--text-primary)",
                    cursor: "pointer",
                    borderRadius: "8px",
                    transition: "all 0.3s ease",
                    fontFamily: "Inter",
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.background = "var(--accent)";
                    e.target.style.transform = "translateY(-2px)";
                    e.target.style.boxShadow = "0 10px 30px rgba(var(--accent-rgb, 0, 245, 255), 0.3)";
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.background = "transparent";
                    e.target.style.transform = "translateY(0)";
                    e.target.style.boxShadow = "none";
                  }}
                  onClick={() => document.getElementById("contact").scrollIntoView({ behavior: "smooth" })}
                >
                  Let's Talk
                </button>
              </div>

              {/* Social Icons */}
              <div style={{
                display: "flex",
                gap: "1rem",
                marginTop: "2rem",
              }}>
                {[
                  { icon: "github", url: "https://github.com/Viraj-Lakshitha12" },
                  { icon: "linkedin", url: "https://www.linkedin.com/in/viraj-lakshitha01/" },
                  { icon: "envelope", url: "mailto:viraj.lakshitha.22222@gmail.com" }
                ].map((social, index) => (
                  <a
                    key={index}
                    href={social.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    style={{
                      width: "50px",
                      height: "50px",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      background: "var(--bg-card)",
                      border: "1px solid var(--border)",
                      borderRadius: "12px",
                      cursor: "pointer",
                      transition: "all 0.3s ease",
                      backdropFilter: "blur(10px)",
                      textDecoration: "none",
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.transform = "translateY(-5px)";
                      e.currentTarget.style.borderColor = "var(--accent)";
                      e.currentTarget.style.boxShadow = "0 10px 20px rgba(var(--accent-rgb, 0, 245, 255), 0.3)";
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.transform = "translateY(0)";
                      e.currentTarget.style.borderColor = "var(--border)";
                      e.currentTarget.style.boxShadow = "none";
                    }}
                  >
                    <i className={`fab fa-${social.icon}`} style={{ color: "var(--accent)", fontSize: "1.2rem" }}></i>
                  </a>
                ))}
              </div>
            </div>

            {/* Right Content - Animated Tech Stack */}
            <div style={{
              position: "relative",
              height: "500px",
