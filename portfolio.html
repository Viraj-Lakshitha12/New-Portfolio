<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viraj Lakshitha Adhikari | Full Stack Engineer</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #13131a;
        --bg-card: rgba(20, 20, 30, 0.8);
        --accent: #00f5ff;
        --accent-secondary: #ff00ff;
        --accent-tertiary: #00ff88;
        --text-primary: #ffffff;
        --text-secondary: #a0a0b0;
        --border: rgba(0, 245, 255, 0.2);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(0, 245, 255, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(255, 0, 255, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 136, 0.1) 0%,
            transparent 60%
          );
        pointer-events: none;
        z-index: 0;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Space Grotesk", sans-serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 4px;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(5deg);
        }
      }

      @keyframes floatSlow {
        0%,
        100% {
          transform: translateY(0px) translateX(0px);
        }
        50% {
          transform: translateY(-30px) translateX(10px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }
        50% {
          box-shadow: 0 0 40px rgba(0, 245, 255, 0.6);
        }
      }

      .fade-in {
        animation: fadeInUp 0.6s ease-out forwards;
      }

      .github-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--accent);
        text-decoration: none;
        padding: 0.5rem 1rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }

      .github-link:hover {
        background: var(--accent);
        color: var(--bg-primary);
        transform: translateY(-2px);
      }

      .tech-badge {
        display: inline-block;
        padding: 0.4rem 0.8rem;
        background: rgba(0, 245, 255, 0.1);
        border: 1px solid rgba(0, 245, 255, 0.3);
        border-radius: 6px;
        font-size: 0.85rem;
        color: var(--accent);
        margin: 0.25rem;
      }

      .map-container {
        width: 100%;
        height: 400px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      /* Mobile Menu */
      .mobile-menu {
        display: none;
      }

      @media (max-width: 768px) {
        .desktop-menu {
          display: none;
        }
        .mobile-menu {
          display: block;
        }
        .map-container {
          height: 300px;
        }
      }

      /* Tech Stack Floating Cards */
      .tech-card {
        position: absolute;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        animation: float 6s ease-in-out infinite;
        transition: all 0.3s ease;
      }

      .tech-card:hover {
        transform: scale(1.1) !important;
        border-color: var(--accent);
        box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
      }

      .tech-card:nth-child(1) {
        animation-delay: 0s;
      }
      .tech-card:nth-child(2) {
        animation-delay: 1s;
        animation-name: floatSlow;
      }
      .tech-card:nth-child(3) {
        animation-delay: 2s;
      }
      .tech-card:nth-child(4) {
        animation-delay: 3s;
        animation-name: floatSlow;
      }
      .tech-card:nth-child(5) {
        animation-delay: 4s;
      }
      .tech-card:nth-child(6) {
        animation-delay: 5s;
        animation-name: floatSlow;
      }
    </style>
  </head>

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Navigation Component - Improved for 2026
      const Navigation = () => {
        const [activeSection, setActiveSection] = useState("home");
        const [scrolled, setScrolled] = useState(false);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 50);

            // Update active section based on scroll position
            const sections = [
              "home",
              "about",
              "experience",
              "projects",
              "skills",
              "contact",
            ];
            for (const section of sections) {
              const element = document.getElementById(section);
              if (element) {
                const rect = element.getBoundingClientRect();
                if (rect.top <= 100 && rect.bottom >= 100) {
                  setActiveSection(section);
                  break;
                }
              }
            }
          };
          window.addEventListener("scroll", handleScroll);
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);

        const scrollToSection = (id) => {
          document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
          setActiveSection(id);
          setMobileMenuOpen(false);
        };

        const navStyle = {
          position: "fixed",
          top: 0,
          left: 0,
          right: 0,
          zIndex: 1000,
          background: scrolled
            ? "rgba(10, 10, 15, 0.95)"
            : "rgba(10, 10, 15, 0.5)",
          backdropFilter: "blur(20px)",
          borderBottom: scrolled
            ? "1px solid var(--border)"
            : "1px solid rgba(0, 245, 255, 0.1)",
          transition: "all 0.3s ease",
          padding: "1rem 0",
        };

        const containerStyle = {
          maxWidth: "1400px",
          margin: "0 auto",
          padding: "0 2rem",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
        };

        const logoStyle = {
          fontSize: "1.3rem",
          fontWeight: "800",
          background:
            "linear-gradient(135deg, var(--accent), var(--accent-secondary))",
          WebkitBackgroundClip: "text",
          WebkitTextFillColor: "transparent",
          fontFamily: "Space Grotesk",
          letterSpacing: "1px",
        };

        const navLinksStyle = {
          display: "flex",
          gap: "2.5rem",
          listStyle: "none",
          alignItems: "center",
        };

        const linkStyle = (isActive) => ({
          color: isActive ? "var(--accent)" : "var(--text-secondary)",
          cursor: "pointer",
          fontSize: "0.9rem",
          fontWeight: "600",
          transition: "all 0.3s ease",
          position: "relative",
          padding: "0.5rem 0",
        });

        const hamburgerStyle = {
          display: "none",
          flexDirection: "column",
          gap: "4px",
          cursor: "pointer",
          padding: "0.5rem",
        };

        const mobileMenuStyle = {
          position: "fixed",
          top: "70px",
          left: 0,
          right: 0,
          background: "rgba(10, 10, 15, 0.98)",
          backdropFilter: "blur(20px)",
          padding: "2rem",
          borderBottom: "1px solid var(--border)",
          transform: mobileMenuOpen ? "translateY(0)" : "translateY(-100%)",
          opacity: mobileMenuOpen ? 1 : 0,
          transition: "all 0.3s ease",
          zIndex: 999,
        };

        return (
          <nav style={navStyle}>
            <div style={containerStyle}>
              <div style={logoStyle}>VIRAJ LAKSHITHA</div>

              {/* Desktop Menu */}
              <ul className="desktop-menu" style={navLinksStyle}>

                  "Home",

                  "Experience",
                  "Projects",
                  "Skills",
                  "Contact",
                ].map((item) => (
                  <li
                    key={item}
                    style={linkStyle(activeSection === item.toLowerCase())}
                    onClick={() => scrollToSection(item.toLowerCase())}
                    onMouseEnter={(e) =>
                      (e.target.style.color = "var(--accent)")
                    }
                    onMouseLeave={(e) =>
                      (e.target.style.color =
                        activeSection === item.toLowerCase()
                          ? "var(--accent)"
                          : "var(--text-secondary)")
                    }
                  >
                    {item}
                  </li>
                ))}
              </ul>
            </div>
          </nav>
        );

                    }}

                      e.target.style.transform = "translateY(0)";

                    }}
                    onClick={() =>
                      document

                    }
                  >
                    View My Work
                  </button>
                  <button

                    onMouseEnter={(e) => {
                      e.target.style.background = "var(--accent)";

                    onClick={() =>

      // About Section
      const About = () => {
        const sectionStyle = {
